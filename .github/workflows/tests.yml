name: NA-Engine CI

on:
  push:
    branches:
      - dev
      - qa
      - main
  pull_request:
    branches:
      - dev
      - qa
      - main

jobs:

  # ───────────────────────────────────────────────
  # DEV — Fast tests (Linux only)
  # ───────────────────────────────────────────────
  dev-tests:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit -q

      - name: Run integration tests
        run: pytest tests/integration -q


  # ───────────────────────────────────────────────
  # QA — Full tests (multiplatform + stress)
  # ───────────────────────────────────────────────
  qa-tests:
    if: github.ref == 'refs/heads/qa'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit -q

      - name: Run integration tests
        run: pytest tests/integration -q

      - name: Run stress tests
        run: pytest tests/stress -vv -s --tb=long --full-trace


  # ───────────────────────────────────────────────
  # MAIN — Final validation before release
  # ───────────────────────────────────────────────
  main-tests:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run full test suite
        run: pytest -vv -s --tb=long --full-trace
